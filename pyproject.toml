[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stable-shift-forecasting"
version = "0.1.0"
description = "Stable representations and label-free online adaptation for shifted load forecasting"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "PyYAML>=6.0",
  "torch>=2.1",
  "matplotlib>=3.7"
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
analysis = ["scipy>=1.10", "PyMuPDF>=1.24", "Pillow>=10"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
